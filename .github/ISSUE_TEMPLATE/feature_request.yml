name: Предложить функцию
description: Опишите идею для Talima
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Проблема / задача
      description: Какую бизнес-задачу решаем?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
      description: Как это должно работать для пользователя?
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Модуль
      options:
        - CRM
        - Academics
        - Finance
        - HR
        - LMS
        - Gamification
        - Analytics
        - Core / Auth
        - Другое
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Затронутые слои
      options:
        - label: Требуется изменение API (backend)
          required: false
        - label: Требуется изменение UI (frontend)
          required: false
